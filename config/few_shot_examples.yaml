# ==============================================================================
# Gold Standard Few-Shot Examples for Enterprise NL2SQL
# Hand-verified SQL queries adhering to SQLite dialect and the Semantic Layer.
# ==============================================================================

examples:
  - question: "What were our top 5 best-selling products by total revenue?"
    intent: "Product performance ranking by net revenue"
    thought: "Join order_items, products, and orders. Filter for completed/shipped orders, compute discounted line total, group by product name, sort descending, limit 5."
    sql: >
      SELECT 
          p.product_name,
          ROUND(SUM(oi.quantity * oi.unit_price * (1.0 - (oi.discount_percent / 100.0))), 2) AS total_revenue,
          SUM(oi.quantity) AS units_sold
      FROM order_items oi
      JOIN products p ON oi.product_id = p.product_id
      JOIN orders o ON oi.order_id = o.order_id
      WHERE o.status IN ('Completed', 'Shipped')
      GROUP BY p.product_id, p.product_name
      ORDER BY total_revenue DESC
      LIMIT 5;

  - question: "Show the monthly revenue trend for the year 2024."
    intent: "Time series revenue analysis"
    thought: "Filter orders in 2024 with status 'Completed' or 'Shipped'. Extract year-month using strftime('%Y-%m', order_date), aggregate sum of total_amount, group by month, order chronologically."
    sql: >
      SELECT 
          strftime('%Y-%m', o.order_date) AS order_month,
          ROUND(SUM(o.total_amount), 2) AS monthly_revenue,
          COUNT(o.order_id) AS total_orders
      FROM orders o
      WHERE o.status IN ('Completed', 'Shipped')
        AND strftime('%Y', o.order_date) = '2024'
      GROUP BY order_month
      ORDER BY order_month ASC;

  - question: "Which customer segments generate the highest average order value?"
    intent: "Customer segmentation vs AOV"
    thought: "Join orders with customers. Filter completed/shipped orders. Group by customer segment, calculate average total_amount, count of orders, and total revenue."
    sql: >
      SELECT 
          c.segment,
          ROUND(AVG(o.total_amount), 2) AS average_order_value,
          ROUND(SUM(o.total_amount), 2) AS total_segment_revenue,
          COUNT(o.order_id) AS total_orders
      FROM orders o
      JOIN customers c ON o.customer_id = c.customer_id
      WHERE o.status IN ('Completed', 'Shipped')
      GROUP BY c.segment
      ORDER BY average_order_value DESC;

  - question: "Identify top 5 customers with the highest lifetime spend."
    intent: "High-value customer identification (CLV)"
    thought: "Join customers with orders. Filter completed/shipped orders. Sum total_amount per customer, sort descending, limit 5."
    sql: >
      SELECT 
          c.customer_id,
          c.first_name || ' ' || c.last_name AS customer_name,
          c.email,
          c.segment,
          c.loyalty_tier,
          ROUND(SUM(o.total_amount), 2) AS lifetime_spend,
          COUNT(o.order_id) AS total_orders
      FROM customers c
      JOIN orders o ON c.customer_id = o.customer_id
      WHERE o.status IN ('Completed', 'Shipped')
      GROUP BY c.customer_id, customer_name, c.email, c.segment, c.loyalty_tier
      ORDER BY lifetime_spend DESC
      LIMIT 5;

  - question: "Compare marketing campaign budget versus actual conversions by channel."
    intent: "Marketing attribution and channel efficiency"
    thought: "Query marketing_campaigns. Group by channel, aggregate total budget, total spent, total conversions, and compute cost per conversion."
    sql: >
      SELECT 
          channel,
          ROUND(SUM(budget), 2) AS total_budget,
          ROUND(SUM(spent), 2) AS total_spent,
          SUM(conversions) AS total_conversions,
          ROUND(SUM(spent) * 1.0 / NULLIF(SUM(conversions), 0), 2) AS cost_per_conversion
      FROM marketing_campaigns
      GROUP BY channel
      ORDER BY total_conversions DESC;

  - question: "Which products have the lowest stock quantity and what is their current status?"
    intent: "Inventory risk analysis"
    thought: "Query products table, join categories for department context, filter products with low stock, order by stock_quantity ascending limit 10."
    sql: >
      SELECT 
          p.product_id,
          p.product_name,
          cat.category_name,
          p.stock_quantity,
          p.unit_price,
          p.status
      FROM products p
      JOIN categories cat ON p.category_id = cat.category_id
      ORDER BY p.stock_quantity ASC
      LIMIT 10;
